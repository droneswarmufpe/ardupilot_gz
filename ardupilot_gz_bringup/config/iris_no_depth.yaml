# Bridge configurations for iris_depth model

---
- ros_topic_name: "/clock" # Global topic
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Consider namespacing robot-specific topics
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/map/model/iris_depth/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/mavros/odometry/out"
  gz_topic_name: "/model/iris_depth/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "gz/tf" # Relayed to /tf in launch file if use_gz_tf is true
  gz_topic_name: "/model/iris_depth/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "gz/tf_static"
  gz_topic_name: "/model/iris_depth/pose_static" # Corrected model name
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/iris_depth/imu"
  gz_topic_name: "/world/map/model/iris_depth/link/imu_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/iris_depth/battery"
  gz_topic_name: "/model/iris_depth/battery/lipo_3500mAh/state" # Corrected: reflects battery_name in SDF
  ros_type_name: "sensor_msgs/msg/BatteryState"
  gz_type_name: "gz.msgs.BatteryState" # Ensure this matches the actual published type; LinearBatteryPlugin might publish gz.msgs.LinearBattery
  direction: GZ_TO_ROS

# OakD-Lite Left RGB Camera (sensor name: left_rgb_camera)
- gz_topic_name: "/stereo_camera/left/image_raw" # Based on <topic> tag in SDF
  ros_topic_name: "/iris_depth/stereo_camera/left/image_raw"
  gz_type_name: "gz.msgs.Image"
  ros_type_name: "sensor_msgs/msg/Image"
  direction: "GZ_TO_ROS"

- gz_topic_name: "/stereo_camera/left/camera_info" # Assuming Gazebo publishes camera_info relative to image topic
  ros_topic_name: "/iris_depth/stereo_camera/left/camera_info"
  gz_type_name: "gz.msgs.CameraInfo"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  direction: "GZ_TO_ROS"

# OakD-Lite Right RGB Camera (sensor name: right_rgb_camera)
- gz_topic_name: "/stereo_camera/right/image_raw" # Based on <topic> tag in SDF
  ros_topic_name: "/iris_depth/stereo_camera/right/image_raw"
  gz_type_name: "gz.msgs.Image"
  ros_type_name: "sensor_msgs/msg/Image"
  direction: "GZ_TO_ROS"

- gz_topic_name: "/stereo_camera/right/camera_info" # Assuming Gazebo publishes camera_info relative to image topic
  ros_topic_name: "/iris_depth/stereo_camera/right/camera_info"
  gz_type_name: "gz.msgs.CameraInfo"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  direction: "GZ_TO_ROS"

